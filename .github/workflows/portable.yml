name: Independent Portable Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: Portable version (MAJOR.MINOR.PATCH)
        required: true
        default: '1.0.0'
  push:
    tags: ['aster-v*']
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: windows-latest
    if: github.repository == 'jawwe/ok-wuthering-waves'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Verify independent channel
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git merge-base --is-ancestor HEAD origin/codex/independent-client
          if ($LASTEXITCODE -ne 0) { throw 'Build only commits from the independent channel.' }
          if ($env:GITHUB_REF -like 'refs/tags/aster-v*') {
            $releaseVersion = $env:GITHUB_REF_NAME.Substring(7)
          } else {
            if ($env:GITHUB_REF -ne 'refs/heads/codex/independent-client') { throw 'Select the independent branch.' }
            $releaseVersion = $env:REQUESTED_VERSION
          }
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid portable version.' }
          "PORTABLE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Create isolated environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt polib==1.2.0 pytest==9.2.0
          .\.venv\Scripts\python.exe -m pip check
      - name: Validate client
        run: |
          .\.venv\Scripts\python.exe -m unittest tests.TestWorkshopCache tests.TestIndependentDistribution tests.TestInputMode tests.TestClientSettingsTab -v
          .\.venv\Scripts\python.exe run_test.py tests/TestCharacterCodeTab.py
          .\.venv\Scripts\python.exe run_test.py tests/TestCustomCharLoader.py
      - name: Refresh snapshot and build portable
        run: .\.venv\Scripts\python.exe tools/build_portable.py --version $env:PORTABLE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: AsterDesk-portable
          path: dist/AsterDesk-*.zip*
          if-no-files-found: error
      - name: Publish independent release
        if: startsWith(github.ref, 'refs/tags/aster-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/AsterDesk-*.zip* --repo jawwe/ok-wuthering-waves --title "AsterDesk $env:PORTABLE_VERSION" --notes-file docs/release-notes.md
