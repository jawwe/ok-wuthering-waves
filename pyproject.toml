[build-system]
requires = ["setuptools>=77", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "asterdesk"
version = "1.0.1"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "ok-script[ocr,qt]==3.0.4",
    "ok-pyside-minimal==6.12.0.post2",
    "onnxocr-ppocrv5==0.0.23",
    "openvino==2026.3.0",
    "opencv-python==5.0.0.93",
    "pyappify==1.0.13"
]

[project.optional-dependencies]
dev = [
    "polib",
    "pytest",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
web-test = [
    "ok-script[web]==3.0.4",
]
